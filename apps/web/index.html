<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SDLG Warranty Claim — PT. Indo Traktor Utama" />
    <title>SDLG Warranty</title>
    <!-- GitHub Pages SPA: restore path after root 404.html redirect -->
    <script>
      (function () {
        try {
          var r = sessionStorage.getItem('spa-redirect');
          if (r) {
            sessionStorage.removeItem('spa-redirect');
            if (r !== location.href) history.replaceState(null, '', r);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
