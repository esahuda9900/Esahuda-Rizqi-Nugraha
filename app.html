/* SDLG_FB_PERSON_HELPER */
function sdlgFeedbackPerson(claim){
  try {
    var n = String((claim && claim.technical_personnel) || "").trim();
    if (!n || /^unknown$/i.test(n)) return "";
    n = n.replace(/^technician\s*[—–-]\s*/i, "").trim();
    return n;
  } catch (e) { return ""; }
}

/* __SDLG_POLICY_RPC_BRIDGE_V1__ */
if (typeof window.SDLGPolicyRulesQuery !== 'function') {
window.SDLGPolicyRulesQuery = async function(client, selectColumns, ruleCodes) {
  try {
    if (!client || !client.auth || typeof client.rpc !== 'function') {
      return { data: [], error: null, deferred: true };
    }
    const sessionResult = await client.auth.getSession();
    const session = sessionResult && sessionResult.data ? sessionResult.data.session : null;
    if (!session) {
      return { data: [], error: null, deferred: true };
    }
    const rpc = await client.rpc('sdlg_policy_runtime_snapshot');
    if (rpc && rpc.error) return { data: null, error: rpc.error };
    const payload = rpc && rpc.data ? rpc.data : [];
    // Normalize all production RPC payload shapes, including a singleton wrapper array.
    const unwrapPolicyPayload = function (value) {
      if (Array.isArray(value)) {
        if (value.length === 1 && value[0] && typeof value[0] === 'object' &&
            Array.isArray(value[0].service_policy_rules)) {
          return value[0].service_policy_rules;
        }
        return value;
      }
      if (value && typeof value === 'object' && Array.isArray(value.service_policy_rules)) {
        return value.service_policy_rules;
      }
      return [];
    };
    const rows = unwrapPolicyPayload(payload);
    const wanted = new Set(Array.isArray(ruleCodes) ? ruleCodes : []);
    const columns = String(selectColumns || '').split(',').map(function(v){ return v.trim(); }).filter(Boolean);
    const data = rows.filter(function(row){ return !wanted.size || wanted.has(row.rule_code); }).map(function(row){
      if (!columns.length) return row;
      const out = {};
      columns.forEach(function(key){ out[key] = row[key]; });
      return out;
    });
    return { data: data, error: null };
  } catch (error) {
    return { data: null, error: error };
  }
};
  }

/* SDLG_COMMAND_CENTER_V2
   Visual-only UI/UX refinement layer.
   Loaded by the existing final visual injector; no business logic changes. */

:root{
  --cc-bg:#f5f7fb;
  --cc-surface:#ffffff;
  --cc-surface-2:#f8fafc;
  --cc-surface-3:#f1f5f9;
  --cc-border:#e6ebf2;
  --cc-border-strong:#d7deea;
  --cc-text:#111827;
  --cc-text-2:#334155;
  --cc-muted:#64748b;
  --cc-faint:#94a3b8;
  --cc-primary:#315de7;
  --cc-primary-dark:#2447b8;
  --cc-primary-soft:#edf3ff;
  --cc-success:#12946a;
  --cc-success-soft:#ebfaf3;
  --cc-warning:#b66a11;
  --cc-warning-soft:#fff7e9;
  --cc-danger:#c43c49;
  --cc-danger-soft:#fff1f2;
  --cc-radius:14px;
  --cc-radius-sm:10px;
  --cc-shadow:0 1px 2px rgba(15,23,42,.035),0 8px 28px rgba(15,23,42,.045);
  --cc-shadow-hover:0 12px 34px rgba(15,23,42,.075);
  --cc-ease:cubic-bezier(.22,1,.36,1);
}

.app-shell:not(:has(.login-screen)),
.app-shell:not(:has(.login-screen)) body{ color:var(--cc-text)!important; }

/* SDLG_SAAS_SHELL_V2
   Popular-SaaS visual system — full ops surface polish.
   Linear / Stripe Dashboard inspired. Visual only.
   Loaded last in modern-refresh cascade (wins). */

:root {
  --sdlg-bg: #f4f6fa;
  --sdlg-surface: #ffffff;
  --sdlg-surface-muted: #f7f8fb;
  --sdlg-border: #e8ecf2;
  --sdlg-border-strong: #d5dbe6;
  --sdlg-text: #0f172a;
  --sdlg-muted: #64748b;
  --sdlg-faint: #94a3b8;
  --sdlg-primary: #3b5bdb;
  --sdlg-primary-strong: #2f4ac0;
  --sdlg-primary-soft: #eef2ff;
  --sdlg-success: #0f9f6e;
  --sdlg-success-soft: #ecfdf5;
  --sdlg-warning: #b45309;
  --sdlg-warning-soft: #fffbeb;
  --sdlg-danger: #dc2626;
  --sdlg-danger-soft: #fef2f2;
  --sdlg-radius: 12px;
  --sdlg-radius-sm: 8px;
  --sdlg-radius-lg: 16px;
  --sdlg-ease: cubic-bezier(.16, 1, .3, 1);
  --sdlg-shadow-xs: 0 1px 2px rgba(15, 23, 42, .04);
  --sdlg-shadow-sm: 0 1px 2px rgba(15, 23, 42, .05), 0 1px 3px rgba(15, 23, 42, .04);
  --sdlg-shadow-md: 0 4px 16px rgba(15, 23, 42, .06), 0 1px 3px rgba(15, 23, 42, .04);
  --sdlg-shadow-lg: 0 12px 40px rgba(15, 23, 42, .08), 0 4px 12px rgba(15, 23, 42, .04);
  --sdlg-ring: 0 0 0 3px rgba(59, 91, 219, .16);
}

html, body {
  background: var(--sdlg-bg) !important;
  color: var(--sdlg-text) !important;
}
body {
  line-height: 1.5 !important;

:root {
  --sdlg-bg: #f5f7fa;

  --sdlg-muted: #64748b;

  --sdlg-primary-strong: #1a3fb0;
  --sdlg-primary-soft: #eff4ff;
  --sdlg-success: #059669;
  --sdlg-success-soft: #ecfdf5;
  --sdlg-warning: #b45309;
  --sdlg-warning-soft: #fffbeb;
  --sdlg-danger: #dc2626;
  --sdlg-danger-soft: #fef2f2;
  --sdlg-radius: 8px;
  --sdlg-radius-sm: 6px;
  --sdlg-radius-lg: 10px;
  --sdlg-ease: cubic-bezier(0.2, 0.8, 0.2, 1);

                issues.push(`Part #${i + 1} Qty: source=${sp.qty} vs parse=${pp.qty ?? "—"}`);

                issues.push(`Part #${i + 1} Amount: source=${sp.amount} vs parse=${pp.amount ?? "—"}`);
        });
    }
    return [...new Set(issues)];
};

const extractSourceFinancialDetails = (rawText) => {

        if (/\bSN\.?\s*\d+/i.test(x) || /[A-Za-z]/.test(x)) return null;

        // "USD -" belongs to Amount when it occupies the Amount column in source.
        // We only fall back to compact numeric parsing when the row has no useful
        // positional structure at all.
        let start = 0;

        if (!nonEmptyIdx.length) return;

        const takeByPosition = (key, idx) => {
            const raw = vals[idx];
            if (raw == null || raw === "") return;
            const n = parseCellMoney(raw);
            if (n != null) out[key] = n;
        };
        targetKeys.forEach((k, i) => takeByPosition(k, i + start));

        // rightmost currency marker as Amount only when there are fewer cells than
        // the full table width and the marker is clearly in the final populated cell.
        const populated = nonEmptyIdx.map(i => ({ i, v: vals[i] }));
        if (targetKeys.includes("labourHrs") && out.labourHrs == null && populated.length) {
            const hr = populated.find(x => parseSourceNumber(x.v) != null);
            if (hr) out.labourHrs = parseSourceNumber(hr.v);
        }

    };
    const findSectionHeader = (line, re) => re.test(line || "");
    for (let i = 0; i < lines.length; i++) {

            for (let r = i + 1; r < Math.min(lines.length, i + 5); r++) {
                const cells = lines[r].split("\t");
                if (cells.some(c => /TOTAL AMOUNT CLAIMED/i.test(cleanSourceCell(c)))) break;
                if (!cells.some(c => cleanSourceCell(c))) continue;
                // Detect the standard 6-column layout by column names/positions.
                // Hrs = col 4, Rate = col 5, Amount = col 6 (1-based).
                const vals = cells.map(cleanSourceCell);

                const vals = cells.map(cleanSourceCell);
                if (!vals.some(Boolean)) continue;
                // Standard row: first three business columns are Km, Rate, Amount
                // after any leading signature/dealer columns. Locate Km using the
                // first numeric value, but keep the currency marker in its original
                // relative position as Amount rather than collapsing blanks.

                // never to Other Rate / Amount.
                if (vals.some(v => /TOTAL AMOUNT CLAIMED/i.test(v))) break;

                const moneyIdx = vals.findIndex(v => /^(?:USD\s*)?\$?\s*[-–—]+$/i.test(v) || parseSourceNumber(v) != null);

                for (const v of lines[r].split("\t")) {

                }

    return out;
};

const extractSourceEvidenceCaptions = (rawText) => {

const buildDeterministicSourceParse = (rawText) => {

        appCode: ["App. Code", "App Code"], model: ["Product Name (Model)"],

        dealerClaimNo: ["Dealer Claim No"], faultDescription: ["Fault Description"],
        comment: ["Comment"], technicalPersonnel: ["Signature of Technical Personnel", "Technical Personnel"],
        distributor: ["Distributor"], dealerName: ["Contact Info (Dealer Name)", "Dealer Name"]
    };

    // A later deterministic Master Unit match may replace p.serialNo with the
    // canonical 17-character machine serial, but it must never erase this source value.

    const commentSource = sourceMultilineBlock(rawText, ["Comment"], [

        "Handling Result (Repair Method)", "Signature of Technical Personnel", "Technical Personnel",
        "Repairs Completion Date", "Customer", "Part Replacement Record", "Dealer", "Total Amount Claimed",
        "Attach relevent photos", "Attach relevant photos"
    ]);
    if (commentSource)
        p.comment = commentSource;
    if (!p.claimType) {
        const claimSource = String(p.distributorNo || p.sdlgNo || "").toUpperCase();
        if (/PFR|FACTORY\s*CLAIM/.test(claimSource))
            p.claimType = "Warranty Claim";
    }

    const inferBranchFromAppCode = (appCode) => {
        const x = String(appCode || "").toUpperCase().replace(/\s+/g, "");
        const suffix = (x.match(/\/([A-Z]{3})$/) || [])[1] || "";
        const map = { JKT: "JAKARTA", BPN: "BALIKPAPAN", BJM: "BANJARMASIN", SMD: "SAMARINDA", PLM: "PALEMBANG", PLB: "PALEMBANG", MKS: "MAKASSAR", MDN: "MEDAN", PKU: "PEKANBARU", LMP: "LAMPUNG", SBY: "SURABAYA", JBI: "JAMBI", PNK: "PONTIANAK", PTK: "PONTIANAK", TKG: "TARAKAN", PLW: "PALU", PLU: "PALU", SRG: "SORONG", BKS: "BENGKULU" };
        return map[suffix] || null;

        const isHelper = v => /^\([^)]*\)$/.test(cleanSourceCell(v));
        for (let li = 0; li < lines.length; li++) {
            const cells = lines[li].split("\t");
            for (let ci = 0; ci < cells.length; ci++) {
                const c = cleanSourceCell(cells[ci]), n = normSourceLabel(c);
                if (!wanted.some(w => n === w || n.startsWith(w + " ")))
                    continue;

                }
                for (let cj = ci + 1; cj < cells.length; cj++) {
                    const v = cleanSourceCell(cells[cj]);
                    if (!v)
                        continue;
                    if (isStop(v))
                        break;
                    if (isHelper(v))
                        continue;

                            break;

                            continue;
