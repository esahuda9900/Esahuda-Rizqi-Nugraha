name: Security Hardening CI

on:
  push:
    branches: [main, '**']
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-security-hardening.js'
      - '.github/workflows/security-hardening.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-security-hardening.js'
      - '.github/workflows/security-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Verify security hardening migration
        run: node scripts/verify-security-hardening.js
