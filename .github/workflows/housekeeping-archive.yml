name: Housekeeping — archive workflows + organize docs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run housekeeping
        run: python3 scripts/housekeeping_archive.py

      - name: Commit changes
        run: |
          git config user.name "sdlg-housekeeping-bot"
          git config user.email "sdlg-housekeeping-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(housekeeping): archive one-off workflows + organize docs into docs/"
            git push origin HEAD
          fi
