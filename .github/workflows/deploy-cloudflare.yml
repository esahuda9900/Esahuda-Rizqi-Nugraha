name: Deploy Cloudflare Workers

# FREE TIER: manual only. Primary deploy = Cloudflare Workers Builds on push to main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'Secrets missing — use Cloudflare Workers Builds / dashboard instead.'
            exit 1
          fi
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.136.3 deploy
      - name: Verify policy v3
        run: |
          set -euo pipefail
          sleep 5
          body="$(curl -fsSL --max-time 30 'https://sdlg-warranty-backup.esahuda9900.workers.dev/modules/policy-runtime-fix.js')"
          echo "$body" | grep -q '__SDLG_POLICY_RUNTIME_FIX_V3__'
