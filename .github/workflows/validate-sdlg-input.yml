name: Validate SDLG Input Single-Source Fix

on:
  push:
    branches:
      - "fix/sdlg-input-single-source-2026-10-12"
  pull_request:
    branches: ["main"]
    paths:
      - "index.html"
      - "modules/**"
      - "scripts/**"
      - ".github/workflows/validate-sdlg-input.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Build and regression contracts (no deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check source syntax
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/pages_prepare_index.py
          bash -n scripts/regression_contract.sh
          bash -n scripts/regression_contract_modules.sh

      - name: Build Pages artifact locally
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp canonical-warranty-helper.js _site/canonical-warranty-helper.js
          cp -R modules _site/modules
          if [ -d styles ]; then cp -R styles _site/styles; fi
          touch _site/.nojekyll
          python3 scripts/pages_prepare_index.py
          test -s _site/index.html
          test -s _site/modules/claim-fields.js
          test -s _site/modules/sdlg-input-hydrate.js
          bash scripts/regression_contract.sh _site/index.html
          bash scripts/regression_contract_modules.sh _site

      - name: Parse changed JavaScript
        run: |
          set -euo pipefail
          node --check modules/sdlg-input-hydrate.js
          node --check modules/sdlg-inline-enforcer.js
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("_site/index.html").read_text(encoding="utf-8", errors="replace")
          pattern = r"function SDLGPortalInputPage\(\{ claims, selectedClaimId, onSelectClaim, onBack \}\) \{[\s\S]*?\n\};"
          match = re.search(pattern, html)
          if not match:
              raise SystemExit("Could not extract built SDLGPortalInputPage for JS syntax check")
          Path(".sdlg-input-page-check.js").write_text(match.group(0), encoding="utf-8")
          print("Extracted SDLGPortalInputPage from baked _site/index.html")
          PY
          node --check .sdlg-input-page-check.js
