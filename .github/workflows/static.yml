name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        if: hashFiles('apps/web/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          # PRODUCTION = legacy web only (CUTOVER FORBIDDEN without owner AUTHORIZE CUTOVER)
          cp index.html _site/index.html
          # Split-login: full React shell lives in app.html after lightweight auth
          if [ -f app.html ]; then
            cp app.html _site/app.html
            echo "Included app.html ($(wc -c < app.html) bytes)"
          fi
          cp canonical-warranty-helper.js _site/canonical-warranty-helper.js
          cp -R modules _site/modules
          if [ -d styles ]; then cp -R styles _site/styles; fi
          touch _site/.nojekyll

          # Build clean Vite app → /preview ONLY (does NOT replace production root)
          if [ -f apps/web/package.json ]; then
            echo "Building apps/web preview SPA…"
            cd apps/web
            npm install --no-audit --no-fund
            export VITE_BASE=/Esahuda-Rizqi-Nugraha/preview/
            # Hard block accidental root base
            if [ "$VITE_BASE" = "/" ] || [ "$VITE_BASE" = "/Esahuda-Rizqi-Nugraha/" ]; then
              echo "FORBIDDEN: VITE_BASE must stay under /preview/ until AUTHORIZE CUTOVER"
              exit 1
            fi
            npx vite build
            mkdir -p ../../_site/preview
            cp -R dist/. ../../_site/preview/
            cp dist/index.html ../../_site/preview/404.html
            cd ../..
            test -s _site/preview/index.html
            # Never allow dist to overwrite production index
            if cmp -s apps/web/dist/index.html _site/index.html 2>/dev/null; then
              echo "FORBIDDEN CUTOVER: SPA dist identical to production index"
              exit 1
            fi
            echo "Preview SPA ready at /preview/"
          elif [ -d preview ]; then
            mkdir -p _site/preview
            cp -R preview/. _site/preview/
            echo "Included checked-in preview/ folder."
          fi

          # Root 404.html — SPA deep-link fallback only (does not replace legacy index)
          if [ -f scripts/pages-preview-404.html ]; then
            cp scripts/pages-preview-404.html _site/404.html
            echo "Installed root SPA 404 fallback."
          fi

          python3 scripts/pages_prepare_index.py

          test -s _site/index.html
          test -s _site/modules/supabase-client.js
          test -s _site/modules/data-pipeline-guard.js
          test -s _site/modules/claim-fields.js
          test -s _site/modules/sdlg-repository.js
          test -s _site/modules/paste-parse-ux.js
          test -s _site/modules/wo-claim-policy.js
          test -s _site/modules/wo-collision-modal.js
          test -s _site/canonical-warranty-helper.js

          bash scripts/regression_contract.sh _site/index.html
          bash scripts/regression_contract_modules.sh _site
          bash scripts/guard-no-cutover.sh _site
          node scripts/verify-navigation-contract.js

          echo "Prepared SDLG static frontend for GitHub Pages (contract OK, no cutover)."

      - name: Validate production JavaScript before publish
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('_site/app.html', 'utf8');
          const head = html.split(/<\/head\s*>/i)[0] || '';
          if (/(?:^|\n)\s*\.\.\.\s*(?:\n|$)/.test(head)) {
            throw new Error('Stray ellipsis text found in HTML head');
          }
          let checked = 0;
          for (const match of html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)) {
            const attrs = match[1] || '';
            const source = match[2] || '';
            if (!source.trim() || /\bsrc\s*=/.test(attrs) || /type\s*=\s*['"](?:application\/json|importmap)['"]/i.test(attrs)) continue;
            new vm.Script(source, { filename: 'app.html:inline-' + (++checked) });
          }
          for (const file of ['modules/navigation-state.js','modules/sdlg-hash-router.js','modules/wo-claim-policy.js','modules/wo-collision-modal.js']) {
            new vm.Script(fs.readFileSync('_site/' + file, 'utf8'), { filename: file });
            checked++;
          }
          if (checked < 10) throw new Error('Unexpectedly few JavaScript blocks checked: ' + checked);
          console.log('Production syntax gate passed for', checked, 'script blocks');
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Snapshot backup branch (auto)
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub already has GITHUB_SHA on main. Update refs via API instead
          # of pushing shallow/partial local Git objects to backup branches.
          DATE=$(date -u +%Y-%m-%d)
          update_snapshot() {
            local branch="$1"
            local endpoint="repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            if gh api "$endpoint" >/dev/null 2>&1; then
              gh api --method PATCH "$endpoint" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/heads/${branch}" -f sha="$GITHUB_SHA" >/dev/null
            fi
            echo "Snapshot ${branch} -> ${GITHUB_SHA}"
          }
          update_snapshot "backup/latest-green"
          update_snapshot "backup/auto-${DATE}"
