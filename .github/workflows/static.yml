name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp canonical-warranty-helper.js _site/canonical-warranty-helper.js
          cp -R modules _site/modules
          if [ -d styles ]; then cp -R styles _site/styles; fi
          touch _site/.nojekyll

          python3 scripts/pages_prepare_index.py

          test -s _site/index.html
          test -s _site/modules/supabase-client.js
          test -s _site/modules/data-pipeline-guard.js
          test -s _site/modules/claim-fields.js
          test -s _site/modules/sdlg-repository.js
          test -s _site/modules/paste-parse-ux.js
          test -s _site/modules/wo-claim-policy.js
          test -s _site/modules/wo-collision-modal.js
          test -s _site/canonical-warranty-helper.js

          bash scripts/regression_contract.sh _site/index.html
          bash scripts/regression_contract_modules.sh _site

          echo "Prepared SDLG static frontend for GitHub Pages (contract OK)."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Snapshot backup branch (auto)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sdlg-backup-bot"
          git config user.email "sdlg-backup-bot@users.noreply.github.com"
          DATE=$(date -u +%Y-%m-%d)
          DAY_BRANCH="backup/auto-${DATE}"
          # Point movable branches at this green SHA
          git branch -f backup/latest-green "${GITHUB_SHA}"
          git branch -f "${DAY_BRANCH}" "${GITHUB_SHA}"
          git push -f origin backup/latest-green
          git push -f origin "${DAY_BRANCH}"
          echo "Backup snapshots: backup/latest-green and ${DAY_BRANCH} -> ${GITHUB_SHA}"
