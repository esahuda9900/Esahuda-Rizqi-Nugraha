# GitHub Pages deployment for the SDLG Warranty static frontend
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp canonical-warranty-helper.js _site/canonical-warranty-helper.js
          cp -R modules _site/modules
          cp -R styles _site/styles
          touch _site/.nojekyll

          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          data = p.read_text(encoding='utf-8', errors='replace')

          reps = [
            ('src="/modules/', 'src="./modules/'),
            ("src='/modules/", "src='./modules/"),
            ('src="/canonical-', 'src="./canonical-'),
            ("src='/canonical-", "src='./canonical-"),
            ('src="/styles/', 'src="./styles/'),
            ("src='/styles/", "src='./styles/"),
            ('href="/modules/', 'href="./modules/'),
            ('href="/styles/', 'href="./styles/'),
          ]
          for a, b in reps:
              data = data.replace(a, b)

          if '<base ' not in data.lower():
              data = data.replace('<head>', '<head>\n  <base href="./">', 1)

          def inject_after_supabase(src_path):
              nonlocal data
              if src_path.split('/')[-1] in data:
                  return
              needle = 'supabase.min.js'
              idx = data.find(needle)
              if idx < 0:
                  # try already-injected supabase-client as anchor
                  idx = data.find('supabase-client.js')
              if idx < 0:
                  return
              end = data.find('</script>', idx)
              if end < 0:
                  return
              inject = '</script>\n  <script src="' + src_path + '"></script>'
              data = data[:end] + inject + data[end + len('</script>'):]

          if 'supabase-client.js' not in data:
              inject_after_supabase('./modules/supabase-client.js')
          if 'data-pipeline-guard.js' not in data:
              # inject after supabase-client if present, else after CDN
              marker = 'supabase-client.js'
              idx = data.find(marker)
              if idx >= 0:
                  end = data.find('</script>', idx)
                  if end >= 0:
                      inject = '</script>\n  <script src="./modules/data-pipeline-guard.js"></script>'
                      data = data[:end] + inject + data[end + len('</script>'):]
              else:
                  inject_after_supabase('./modules/data-pipeline-guard.js')

          p.write_text(data, encoding='utf-8')
          print('index.html path rewrite + pipeline guard inject complete')
          PY

          test -s _site/index.html
          test -s _site/modules/supabase-client.js
          test -s _site/modules/data-pipeline-guard.js
          grep -q 'supabase-client.js' _site/index.html
          ! grep -qE 'src="/modules/' _site/index.html
          echo "Prepared SDLG static frontend for GitHub Pages."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
