name: Frontend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'app.html'
      - 'canonical-warranty-helper.js'
      - 'modules/**'
      - 'scripts/**'
      - 'styles/**'
      - 'package.json'
      - 'ARCHITECTURE.md'
      - 'DEPLOYMENT.md'
      - '.github/workflows/frontend-ci.yml'
permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.html
          test -s canonical-warranty-helper.js
          test -s modules/sdlg-core.js
          test -s modules/export-table-helper.js
          test -s modules/claim-parser-helpers.js
          test -s modules/claim-fields.js
          test -s modules/sdlg-repository.js
          test -s scripts/verify-module-syntax.js
          grep -q 'frqvelcreczmnofldrga.supabase.co' index.html
          grep -q 'SDLGCore' modules/sdlg-core.js
          echo 'Required frontend files present.'

      - name: Validate Python scripts compile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          echo 'Python scripts compile successfully.'

      - name: Validate production GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp app.html _site/app.html
          cp canonical-warranty-helper.js _site/canonical-warranty-helper.js
          mkdir -p _site/modules _site/styles
          rsync -a --exclude '_archive' modules/ _site/modules/
          if [ -d styles ]; then rsync -a --exclude '_archive' styles/ _site/styles/; fi
          touch _site/.nojekyll
          python3 scripts/pages_prepare_index.py
          bash scripts/regression_contract.sh _site/index.html
          bash scripts/regression_contract_modules.sh _site
          bash scripts/guard-no-cutover.sh _site
          rm -rf _site
          echo 'Production Pages artifact and safety contracts passed.'

      - name: Validate changed module syntax & portal contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-module-syntax.js
          node scripts/verify-navigation-contract.js
          node scripts/verify-portal-ui-ownership.js
          node scripts/verify-legacy-auth-ui.js
          node scripts/verify-legacy-claims-loading.js
          node scripts/verify-save-integrity.js
          node --check modules/claim-fields.js
          node --check modules/sdlg-repository.js
          SKIP_WARRANTY_GOLDEN=1 npm run verify
          echo 'Frontend CI verification suite passed.'
