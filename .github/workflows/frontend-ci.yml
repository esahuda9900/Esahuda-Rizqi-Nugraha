name: Frontend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'canonical-warranty-helper.js'
      - 'modules/**'
      - 'scripts/**'
      - 'styles/**'
      - 'package.json'
      - 'ARCHITECTURE.md'
      - 'DEPLOYMENT.md'
      - 'FREE_TIER.md'
      - 'SECURITY.md'
      - 'INJECTOR_ROADMAP.md'
      - '.github/workflows/frontend-ci.yml' 
permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s canonical-warranty-helper.js
          test -s modules/sdlg-core.js
          test -s modules/export-table-helper.js
          test -s modules/claim-parser-helpers.js
          test -s scripts/verify-public-release.js
          test -s scripts/verify-module-syntax.js
          test -s INJECTOR_ROADMAP.md
          test -s FREE_TIER.md
          test -s SECURITY.md
          grep -q 'frqvelcreczmnofldrga.supabase.co' index.html
          grep -q 'SDLGCore' modules/sdlg-core.js
          echo 'Required frontend files, sdlg-core, module syntax verifier, stability docs, Supabase endpoint, and public-release verifier are present.'

      - name: Validate Python patch scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          echo 'Python patch scripts compile successfully.'

      - name: Validate external module syntax
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-module-syntax.js
          echo 'All extracted frontend modules parse successfully.'

      - name: Run production build and regression gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-production.js
          echo 'Production build + regression gate passed.'

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@10.11.1 --no-audit --no-fund
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production root canonical helper race torture test
        run: node scripts/browser-e2e-root-helper-race.js

      - name: Validate historical patch scripts are present
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/apply_action_center.py
          test -f scripts/apply_report_naming.py
          test -f scripts/apply_workflow_catchup.py
          echo 'Historical patch scripts are present.'
