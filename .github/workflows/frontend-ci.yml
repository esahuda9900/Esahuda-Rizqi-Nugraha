name: Frontend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'app.html'
      - 'canonical-warranty-helper.js'
      - 'modules/**'
      - 'scripts/**'
      - 'styles/**'
      - 'package.json'
      - 'ARCHITECTURE.md'
      - 'DEPLOYMENT.md'
      - '.github/workflows/frontend-ci.yml'
permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s canonical-warranty-helper.js
          test -s modules/sdlg-core.js
          test -s modules/export-table-helper.js
          test -s modules/claim-parser-helpers.js
          test -s modules/claim-fields.js
          test -s modules/sdlg-input-hydrate.js
          test -s modules/sdlg-inline-enforcer.js
          test -s scripts/verify-module-syntax.js
          grep -q 'frqvelcreczmnofldrga.supabase.co' index.html
          grep -q 'SDLGCore' modules/sdlg-core.js
          echo 'Required frontend files present.'

      - name: Validate Python scripts compile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          echo 'Python scripts compile successfully.'

      - name: Validate production GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp canonical-warranty-helper.js _site/canonical-warranty-helper.js
          cp -R modules _site/modules
          if [ -d styles ]; then cp -R styles _site/styles; fi
          touch _site/.nojekyll
          python3 scripts/pages_prepare_index.py
          bash scripts/regression_contract.sh _site/index.html
          bash scripts/regression_contract_modules.sh _site
          bash scripts/guard-no-cutover.sh _site
          echo 'Production Pages artifact and safety contracts passed.'

      - name: Validate changed module syntax
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-module-syntax.js
          node scripts/verify-login-freeze.js
          node --check modules/sdlg-input-hydrate.js
          node --check modules/sdlg-inline-enforcer.js
          node --check modules/claim-fields.js
          # Ensure aggressive writers are disabled in this PR lineage
          grep -q 'V4_DISABLED\|intentionally disabled' modules/sdlg-inline-enforcer.js
          grep -q 'event-driven' modules/sdlg-input-hydrate.js
          grep -q '20261021-v15' modules/claim-fields.js
          echo 'Form identity module syntax and disable markers OK.'
