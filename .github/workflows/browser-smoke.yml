name: Browser Smoke Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts

      - name: Verify Chrome runtime
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version

      - name: Run production browser smoke (Cloudflare primary)
        env:
          BASE_URL: https://sdlg-warranty-backup.esahuda9900.workers.dev/
          SUPABASE_URL: https://frqvelcreczmnofldrga.supabase.co
          PLAYWRIGHT_CHANNEL: chrome
        shell: bash
        run: |
          set -euo pipefail
          npm run browser:smoke
