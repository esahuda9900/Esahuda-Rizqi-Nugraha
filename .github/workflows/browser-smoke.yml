name: Browser Smoke

# FREE TIER: manual only
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts

      - name: Verify Chrome runtime
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version

      - name: Run production browser smoke (GitHub Pages)
        env:
          BASE_URL: https://esahuda9900.github.io/Esahuda-Rizqi-Nugraha/
          SUPABASE_URL: https://frqvelcreczmnofldrga.supabase.co
          PLAYWRIGHT_CHANNEL: chrome
        shell: bash
        run: |
          set -euo pipefail
          npm run browser:smoke
