name: Validate SDLG Input Live-Only Fix

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'modules/claim-fields.js'
      - 'modules/sdlg-input-hydrate.js'
      - 'modules/sdlg-inline-enforcer.js'
      - 'scripts/pages_prepare_index.py'
      - 'scripts/regression_contract.sh'
      - 'scripts/regression_contract_modules.sh'
      - 'scripts/verify_sdlg_live_claim_patch.py'
      - '.github/workflows/validate-sdlg-input-live-only.yml'

permissions:
  contents: read

concurrency:
  group: sdlg-input-live-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check patch and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/pages_prepare_index.py scripts/verify_sdlg_live_claim_patch.py
          bash -n scripts/regression_contract.sh
          bash -n scripts/regression_contract_modules.sh

      - name: Verify source contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/regression_contract.sh index.html
          bash scripts/regression_contract_modules.sh .

      - name: Verify generated Pages index and inline JavaScript syntax
        run: python3 scripts/verify_sdlg_live_claim_patch.py

      - name: Check changed module JavaScript syntax
        run: |
          node --check modules/claim-fields.js
          node --check modules/sdlg-input-hydrate.js
          node --check modules/sdlg-inline-enforcer.js
