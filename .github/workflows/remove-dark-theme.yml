name: Remove dark theme (light-only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  strip-dark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Strip dark theme from CSS + app.html
        shell: bash
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import re

          def strip_prefers_dark_blocks(text):
              out = []
              i = 0
              pattern = re.compile(r'@media\s*\(\s*prefers-color-scheme\s*:\s*dark\s*\)\s*\{', re.I)
              while True:
                  m = pattern.search(text, i)
                  if not m:
                      out.append(text[i:])
                      break
                  out.append(text[i:m.start()])
                  depth = 0
                  j = m.end() - 1
                  while j < len(text):
                      if text[j] == '{':
                          depth += 1
                      elif text[j] == '}':
                          depth -= 1
                          if depth == 0:
                              j += 1
                              break
                      j += 1
                  i = j
              return ''.join(out)

          def strip_data_theme_dark_rules(text):
              out = text
              sel_re = re.compile(r'(?:html)?\[data-theme=["\']dark["\']\][^{]*\{', re.I)
              while True:
                  m = sel_re.search(out)
                  if not m:
                      break
                  depth = 0
                  j = m.end() - 1
                  while j < len(out):
                      if out[j] == '{':
                          depth += 1
                      elif out[j] == '}':
                          depth -= 1
                          if depth == 0:
                              j += 1
                              break
                      j += 1
                  out = out[:m.start()] + out[j:]
              return out

          def strip_theme_switcher_rules(text):
              while True:
                  m = re.search(r'\.sdlg-theme-switcher[^{]*\{', text)
                  if not m:
                      break
                  depth = 0
                  j = m.end() - 1
                  while j < len(text):
                      if text[j] == '{':
                          depth += 1
                      elif text[j] == '}':
                          depth -= 1
                          if depth == 0:
                              j += 1
                              break
                      j += 1
                  text = text[:m.start()] + text[j:]
              return text

          def force_light_scheme(text):
              text = re.sub(r'color-scheme\s*:\s*light\s+dark\s*;', 'color-scheme: light;', text)
              text = re.sub(r'color-scheme\s*:\s*dark\s*;', 'color-scheme: light;', text)
              return text

          changed = []
          for path in sorted(Path('styles').glob('*.css')):
              raw = path.read_text(encoding='utf-8', errors='replace')
              new = raw
              new = strip_prefers_dark_blocks(new)
              new = strip_data_theme_dark_rules(new)
              new = strip_theme_switcher_rules(new)
              new = force_light_scheme(new)
              if new != raw:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
                  print('patched', path)

          app = Path('app.html')
          html = app.read_text(encoding='utf-8', errors='replace')
          orig = html

          html = re.sub(r'<script\s+data-sdlg-theme-boot>[\s\S]*?</script>\s*', '', html, flags=re.I)
          html = re.sub(r'<div\s+class="sdlg-theme-switcher"[^>]*>[\s\S]*?</div>\s*', '', html, flags=re.I)

          def fix_html_tag(m):
              attrs = re.sub(r'\s*data-theme="[^"]*"', '', m.group(1))
              return '<html' + attrs + ' data-theme="light">'
          html = re.sub(r'<html([^>]*)>', fix_html_tag, html, count=1, flags=re.I)

          light_css = '''<style id="sdlg-light-only">
  /* HARD LIGHT-ONLY — dark theme removed 2026-10-30 */
  :root, html, body { color-scheme: light !important; }
  .sdlg-theme-switcher { display: none !important; }
  @media (prefers-color-scheme: dark) {
    :root, html {
      --sdlg-bg: #f3f6fa !important;
      --sdlg-surface: #ffffff !important;
      --sdlg-surface-muted: #f8fafc !important;
      --sdlg-border: #e2e8f0 !important;
      --sdlg-border-strong: #cbd5e1 !important;
      --sdlg-text: #0f172a !important;
      --sdlg-text-muted: #64748b !important;
      --sdlg-muted: #64748b !important;
      --ui-bg: #eef1f7 !important;
      --ui-surface: #ffffff !important;
      --ui-text: #0c1526 !important;
      --ui-muted: #5a6578 !important;
      --ui-glass: rgba(255,255,255,0.75) !important;
      --ui-glass-strong: rgba(255,255,255,0.96) !important;
    }
  }
</style>
'''
          if 'sdlg-light-only' not in html and '</head>' in html:
              html = html.replace('</head>', light_css + '</head>', 1)

          # Also strip dark blocks from INLINE styles inside app.html
          html = strip_prefers_dark_blocks(html)
          html = strip_data_theme_dark_rules(html)
          html = strip_theme_switcher_rules(html)

          if html != orig:
              app.write_text(html, encoding='utf-8')
              changed.append('app.html')
              print('patched app.html')

          readme = Path('styles/README.md')
          if readme.exists():
              t = readme.read_text(encoding='utf-8')
              if 'light-only' not in t.lower() and 'Light only' not in t:
                  t = t.rstrip() + '\n\n## Theme\n\n**Light only.** Dark theme removed 2026-10-30 (OS preference ignored).\n'
                  readme.write_text(t, encoding='utf-8')
                  changed.append('styles/README.md')

          print('CHANGED', len(changed))
          for c in changed:
              print(' -', c)
          PY

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "fix(ui): remove all dark theme — force light-only"
          git push origin HEAD:main
