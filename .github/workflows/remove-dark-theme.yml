name: Remove dark theme (light-only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  strip-dark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Strip dark theme from CSS + app.html
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/strip-dark-theme.py

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "fix(ui): remove all dark theme — force light-only"
          git push origin HEAD:main
