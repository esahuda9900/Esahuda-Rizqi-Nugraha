name: Bust dashboard polish cache
on:
  workflow_dispatch:
  push:
    paths:
      - 'styles/sdlg-dashboard-polish.css'
      - 'styles/sdlg-overview-v1.css'
jobs:
  bust:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.html')
          t = p.read_text(encoding='utf-8')
          VER = '20261030-structure-v64'
          # Normalize any prior cache key to the new one
          for old in [
              '20261030-declutter-kpi-v1',
              '20261030-overview-v1',
              '20261030-structure-v64',
          ]:
              t = t.replace(
                  f'styles/sdlg-dashboard-polish.css?v={old}',
                  f'styles/sdlg-dashboard-polish.css?v={VER}',
              )
              t = t.replace(
                  f'styles/sdlg-overview-v1.css?v={old}',
                  f'styles/sdlg-overview-v1.css?v={VER}',
              )
          if 'sdlg-dashboard-polish.css?v=' not in t:
              t = t.replace(
                  'href="styles/sdlg-dashboard-polish.css"',
                  f'href="styles/sdlg-dashboard-polish.css?v={VER}"',
              )
          if 'sdlg-overview-v1.css?v=' not in t and 'sdlg-overview-v1.css' in t:
              t = t.replace(
                  'href="styles/sdlg-overview-v1.css"',
                  f'href="styles/sdlg-overview-v1.css?v={VER}"',
              )
          p.write_text(t, encoding='utf-8')
          print('dashboard', t.count(f'sdlg-dashboard-polish.css?v={VER}'))
          print('overview', t.count(f'sdlg-overview-v1.css?v={VER}'))
          print('old declutter', t.count('declutter-kpi-v1'))
          PY
          git config user.name "sdlg-bot"
          git config user.email "sdlg-bot@users.noreply.github.com"
          git add app.html
          git diff --cached --quiet && echo No change && exit 0
          git commit -m "chore(cache): force structure-v64 CSS query on app.html"
          git push
