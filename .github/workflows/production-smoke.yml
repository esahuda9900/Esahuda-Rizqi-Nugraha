name: Production Smoke Check

# FREE TIER: manual only — do not burn minutes on every push
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-curl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GitHub Pages HTML markers + modules
        shell: bash
        run: |
          set -euo pipefail
          url='https://esahuda9900.github.io/Esahuda-Rizqi-Nugraha/'
          html="$(curl -fsSL --max-time 30 "$url")"
          test -n "$html"
          for marker in \
            'frqvelcreczmnofldrga.supabase.co' \
            'canonical-warranty-helper.js' \
            'modules/claim-fields.js' \
            'SDLG Warranty'; do
            case "$html" in
              *"$marker"*) echo "OK marker: $marker" ;;
              *) echo "Missing marker: $marker"; exit 1 ;;
            esac
          done
          # modules must be real JS on Pages (not SPA HTML fallback)
          for asset in modules/claim-fields.js modules/supabase-client.js modules/sdlg-portal-finance-ux.js; do
            body="$(curl -fsSL --max-time 30 "${url}${asset}")"
            case "$body" in
              *'<!DOCTYPE html>'*|*'<!doctype html>'*)
                echo "FAIL: ${asset} returned HTML (SPA fallback)"; exit 1 ;;
            esac
            echo "OK asset: $asset"
          done

      - name: Supabase REST + RLS
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://frqvelcreczmnofldrga.supabase.co/rest/v1/)"
          case "$code" in 200|401|403) echo "Supabase REST HTTP $code" ;; *) echo "Unexpected $code"; exit 1 ;; esac
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 'https://frqvelcreczmnofldrga.supabase.co/rest/v1/claims?select=id&limit=1')"
          case "$code" in 401|403) echo "claims protected HTTP $code" ;; *) echo "claims leak HTTP $code"; exit 1 ;; esac
