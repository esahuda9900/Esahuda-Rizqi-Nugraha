name: Cloudflare Build Configuration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'package.json'
      - '.github/workflows/cloudflare-build-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'arch/consolidate-cloudflare-build-authority' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile production Workers Build variables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SCRIPT_NAME: sdlg-warranty-backup
        shell: bash
        run: |
          set -euo pipefail

          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          base="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          scripts_json="$(curl -fsSL --retry 3 --max-time 30 "$base/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" "${auth[@]}")"
          worker_tag="$(printf '%s' "$scripts_json" | jq -r --arg name "$CLOUDFLARE_SCRIPT_NAME" '.result[] | select(.id == $name) | .tag' | head -n 1)"
          test -n "$worker_tag"

          triggers_json="$(curl -fsSL --retry 3 --max-time 30 "$base/accounts/$CLOUDFLARE_ACCOUNT_ID/builds/workers/$worker_tag/triggers" "${auth[@]}")"
          trigger_uuid="$(printf '%s' "$triggers_json" | jq -r '
            if (.result | type) == "array" then
              (
                .result[]
                | select((.branch_includes // []) | index("main"))
              ).trigger_uuid // empty
            else empty end
          ' | head -n 1)"

          if [ -z "$trigger_uuid" ]; then
            trigger_uuid="$(printf '%s' "$triggers_json" | jq -r '
              if (.result | type) == "array" then
                (.result[] | select((.trigger_name // "") | test("production"; "i"))).trigger_uuid // empty
              else empty end
            ' | head -n 1)"
          fi

          test -n "$trigger_uuid"

          env_endpoint="$base/accounts/$CLOUDFLARE_ACCOUNT_ID/builds/triggers/$trigger_uuid/environment_variables"

          curl -fsSL --retry 3 --max-time 30 -X PATCH "$env_endpoint" "${auth[@]}" \
            -d '{"NODE_VERSION":{"value":"22","is_secret":false},"PNPM_VERSION":{"value":"10.11.1","is_secret":false}}' \
            > /tmp/cloudflare-build-env.json

          verified="$(curl -fsSL --retry 3 --max-time 30 "$env_endpoint" "${auth[@]}")"
          node_version="$(printf '%s' "$verified" | jq -r '.result.NODE_VERSION.value // empty')"
          pnpm_version="$(printf '%s' "$verified" | jq -r '.result.PNPM_VERSION.value // empty')"

          echo "worker_tag=$worker_tag"
          echo "trigger_uuid=$trigger_uuid"
          echo "NODE_VERSION=$node_version"
          echo "PNPM_VERSION=$pnpm_version"

          test "$node_version" = "22"
          test "$pnpm_version" = "10.11.1"
          echo "PASS: Cloudflare production Workers Build variables are pinned."
