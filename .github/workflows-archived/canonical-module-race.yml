name: Canonical Module Carry-Over Contract

on:
  pull_request:
    paths:
      - 'modules/canonical-warranty-helper.js'
      - 'scripts/browser-e2e-policy-carryover.js'
      - 'package.json'
      - '.github/workflows/canonical-module-race.yml'
  push:
    branches:
      - '**'
    paths:
      - 'modules/canonical-warranty-helper.js'
      - 'scripts/browser-e2e-policy-carryover.js'
      - 'package.json'
      - '.github/workflows/canonical-module-race.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-module-race:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Enable pnpm
        run: |
          set -euo pipefail
          npm install --global pnpm@10.11.1 --no-audit --no-fund
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run direct canonical module race test
        env:
          MODULE_ONLY: true
        run: npm run test:browser-policy-carryover

      - name: Upload module race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-module-race-${{ github.run_number }}
          path: production-verify/canonical-policy-carryover.json
          if-no-files-found: error
          retention-days: 14
