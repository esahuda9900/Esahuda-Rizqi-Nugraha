<!DOCTYPE html>
<html lang="id">
<head>
  <base href="./">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SDLG Warranty Claim — Login | PT. Indo Traktor Utama</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d4ed8'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='white' font-size='15' font-family='system-ui' font-weight='800'%3ES%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --primary-focus: rgba(29, 78, 216, 0.16);
      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-400: #94a3b8;
      --slate-300: #cbd5e1;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --slate-50: #f8fafc;
      --card-bg: #ffffff;
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--slate-900);
      background-color: #f0f4f9;
      background-image:
        radial-gradient(at 0% 0%, rgba(29, 78, 216, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(14, 165, 233, 0.07) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(30, 41, 59, 0.04) 0px, transparent 60%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background grid */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(226, 232, 240, 0.5) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(226, 232, 240, 0.5) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse 65% 55% at 50% 50%, #000 70%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 65% 55% at 50% 50%, #000 70%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid rgba(226, 232, 240, 0.85);
      border-radius: var(--radius-lg);
      padding: 36px 32px 30px;
      box-shadow: 
        0 1px 3px rgba(15, 23, 42, 0.04),
        0 20px 48px -12px rgba(15, 23, 42, 0.10);
      position: relative;
      overflow: hidden;
    }

    /* Subtle top indicator hairline */
    .card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #1d4ed8, #60a5fa, #38bdf8, #1d4ed8);
      background-size: 200% 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .card.is-authenticating::after {
      opacity: 1;
      animation: auth-bar-slide 1.5s linear infinite;
    }

    @keyframes auth-bar-slide {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 60%, #3b82f6 100%);
      color: #ffffff;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.04em;
      box-shadow: 
        0 8px 18px rgba(29, 78, 216, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-corp {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate-500);
      line-height: 1.2;
    }

    .brand-app-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--slate-900);
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-top: 2px;
    }

    .heading-block {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.5rem;
      letter-spacing: -0.035em;
      font-weight: 800;
      color: var(--slate-900);
      line-height: 1.25;
      margin-bottom: 8px;
    }

    p.sub {
      color: var(--slate-500);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--slate-700);
      margin-bottom: 7px;
      letter-spacing: 0.01em;
    }

    .input-wrapper {
      position: relative;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: var(--slate-900);
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    input:hover {
      border-color: #94a3b8;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-focus);
    }

    input::placeholder {
      color: #94a3b8;
    }

    button#btn {
      width: 100%;
      height: 46px;
      margin-top: 6px;
      padding: 0 20px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
      color: #ffffff;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 
        0 4px 12px rgba(29, 78, 216, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.15s ease;
    }

    button#btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%);
      box-shadow: 
        0 8px 20px rgba(29, 78, 216, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    button#btn:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(29, 78, 216, 0.2);
    }

    button#btn:disabled {
      opacity: 0.85;
      cursor: wait;
      transform: none;
    }

    /* Input skeleton shimmer state */
    .card.is-authenticating .input-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
    }

    .card.is-authenticating .input-wrapper::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      border-radius: 10px;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(226, 232, 240, 0.7) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      animation: skeleton-field-shimmer 1.5s infinite ease-in-out;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes skeleton-field-shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .card.is-authenticating input {
      background-color: #f8fafc !important;
      border-color: #cbd5e1 !important;
      color: #94a3b8 !important;
      cursor: wait !important;
      user-select: none;
      box-shadow: none !important;
    }

    /* Micro-progress indicator along button bottom */
    .card.is-authenticating button#btn {
      cursor: wait;
      opacity: 0.96;
    }

    .card.is-authenticating button#btn::before {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2.5px;
      width: 45%;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
      border-radius: 1px;
      animation: btn-bar-sweep 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes btn-bar-sweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }

    /* Button spinner & check */
    .btn-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: btn-spin 0.65s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }

    .btn-check {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      font-size: 13px;
      font-weight: 800;
    }

    @keyframes btn-spin {
      to { transform: rotate(360deg); }
    }

    /* Pulsing status dot during auth */
    .card.is-authenticating .security-dot {
      background: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
      animation: sec-pulse 1.2s infinite ease-in-out;
    }

    .card.is-success .security-dot {
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
    }

    @keyframes sec-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.6; }
    }

    /* Smooth zero-jump alert notification */
    #msg {
      border-radius: 8px;
      font-size: 0.82rem;
      line-height: 1.4;
      transition: opacity 0.2s ease, max-height 0.25s cubic-bezier(0.16, 1, 0.3, 1), margin-bottom 0.25s ease, padding 0.25s ease;
      overflow: hidden;
      margin-bottom: 0;
      padding: 0 12px;
      max-height: 0;
      opacity: 0;
      border: 1px solid transparent;
      box-sizing: border-box;
    }

    #msg.has-msg {
      max-height: 80px;
      opacity: 1;
      padding: 10px 12px;
      margin-bottom: 16px;
    }

    #msg.err {
      color: #b91c1c;
      background: #fef2f2;
      border-color: #fecaca;
    }

    #msg.ok {
      color: #047857;
      background: #ecfdf5;
      border-color: #a7f3d0;
    }

    .footer-meta {
      margin-top: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .security-note {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--slate-500);
      font-weight: 500;
    }

    .security-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
    }

    .copyright {
      font-size: 11px;
      color: var(--slate-400);
    }

    @media (max-width: 480px) {
      .card {
        padding: 28px 20px 24px;
        border-radius: 16px;
      }
      h1 {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="card">
      <div class="brand-header">
        <div class="brand-mark" aria-hidden="true">S</div>
        <div class="brand-text">
          <span class="brand-corp">PT. Indo Traktor Utama</span>
          <span class="brand-app-title">SDLG Official Dealer</span>
        </div>
      </div>
      
      <div class="heading-block">
        <h1>SDLG Warranty Portal</h1>
        <p class="sub">Masuk dengan kredensial dealer untuk mengelola dan memantau klaim garansi SDLG.</p>
      </div>

      <div id="msg" class="err" role="alert"></div>

      <form id="f">
        <div class="form-group">
          <label for="email">Alamat Email</label>
          <div class="input-wrapper">
            <input id="email" type="email" autocomplete="username" placeholder="nama@indotraktor.co.id" required autofocus />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <div class="input-wrapper">
            <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
          </div>
        </div>

        <button id="btn" type="submit">Masuk ke Portal</button>
      </form>

      <div class="footer-meta">
        <div class="security-note">
          <span class="security-dot"></span>
          <span>Terkoneksi ke Supabase Cloud (SSL 256-bit)</span>
        </div>
        <div class="copyright">
          © 2026 PT. Indo Traktor Utama · SDLG Division
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
  <script src="./modules/supabase-client.js?v=20261030-stable-v2"></script>
  <script src="./modules/data-pipeline-guard.js?v=20261030-stable-v2"></script>
  <script src="./modules/claim-fields.js?v=20261030-stable-v2"></script>
  <script src="./modules/sdlg-repository.js?v=20261030-stable-v2"></script>
  <script src="./modules/paste-parse-ux.js?v=20261030-stable-v2"></script>
  <script src="./modules/wo-claim-policy.js?v=20261030-stable-v2"></script>
  <script src="./modules/wo-collision-modal.js?v=20261030-stable-v2"></script>
  <script>
(function () {
  var URL = 'https://frqvelcreczmnofldrga.supabase.co';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZycXZlbGNyZWN6bW5vZmxkcmdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMzQyMDksImV4cCI6MjEwMzkxMDIwOX0.EQoGxEu8cNDF84tObZH13rwHiYt9EGcqnJiT3yRMa-w';
  var msg = document.getElementById('msg');
  var btn = document.getElementById('btn');
  var card = document.querySelector('.card');
  var emailInput = document.getElementById('email');
  var passwordInput = document.getElementById('password');
  var secNote = document.querySelector('.security-note span:last-child');
  var client = null;

  function show(t, ok) {
    if (!t) {
      msg.textContent = '';
      msg.className = '';
      return;
    }
    msg.textContent = t;
    msg.className = (ok ? 'ok' : 'err') + ' has-msg';
  }

  function setAuthLoading(loading, statusText, isSuccess) {
    var form = document.getElementById('f');
    if (loading) {
      if (card) {
        card.classList.add('is-authenticating');
        if (isSuccess) card.classList.add('is-success');
        else card.classList.remove('is-success');
      }
      if (form) form.setAttribute('aria-busy', 'true');
      btn.disabled = true;
      if (isSuccess) {
        btn.innerHTML = '<span class="btn-check" aria-hidden="true">✓</span><span>' + (statusText || 'Berhasil. Membuka aplikasi...') + '</span>';
        btn.style.background = 'linear-gradient(135deg, #059669 0%, #10b981 100%)';
        btn.style.boxShadow = '0 4px 14px rgba(5, 150, 105, 0.35)';
      } else {
        btn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span><span>' + (statusText || 'Memverifikasi Kredensial...') + '</span>';
        btn.style.background = '';
        btn.style.boxShadow = '';
      }
      if (emailInput) emailInput.readOnly = true;
      if (passwordInput) passwordInput.readOnly = true;
      if (secNote) secNote.textContent = isSuccess ? 'Sesi terverifikasi. Mengarahkan...' : 'Menghubungkan ke Supabase Auth SSL...';
    } else {
      if (card) card.classList.remove('is-authenticating', 'is-success');
      if (form) form.removeAttribute('aria-busy');
      btn.disabled = false;
      btn.innerHTML = 'Masuk ke Portal';
      btn.style.background = '';
      btn.style.boxShadow = '';
      if (emailInput) emailInput.readOnly = false;
      if (passwordInput) passwordInput.readOnly = false;
      if (secNote) secNote.textContent = 'Terkoneksi ke Supabase Cloud (SSL 256-bit)';
    }
  }

  function getClient() {
    if (client) return client;
    if (!window.supabase || !window.supabase.createClient) throw new Error('Supabase CDN gagal dimuat');
    client = window.supabase.createClient(URL, ANON, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false,
        storageKey: 'sb-frqvelcreczmnofldrga-auth-token'
      }
    });
    return client;
  }

  function goApp() {
    window.location.replace('./app.html?v=20261105-master-polish-v10');
  }

  setTimeout(function () {
    try {
      var c = getClient();
      c.auth.getSession().then(function (res) {
        if (res && res.data && res.data.session) goApp();
      }).catch(function () {});
    } catch (e) {}
  }, 100);

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    show('');
    setAuthLoading(true, 'Memverifikasi Kredensial...');
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var done = false;
    var timer = setTimeout(function () {
      if (done) return;
      done = true;
      setAuthLoading(false);
      show('Koneksi terlalu lama. Coba lagi.');
    }, 12000);
    try {
      var c = getClient();
      c.auth.signInWithPassword({ email: email, password: password }).then(function (res) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        if (res.error) {
          setAuthLoading(false);
          show(res.error.message || 'Login gagal');
          if (passwordInput) {
            passwordInput.value = '';
            passwordInput.focus();
          }
          return;
        }
        show('Berhasil. Membuka aplikasi...', true);
        setAuthLoading(true, 'Berhasil. Membuka aplikasi...', true);
        setTimeout(goApp, 350);
      }).catch(function (err) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        setAuthLoading(false);
        show((err && err.message) || 'Login gagal');
        if (passwordInput) passwordInput.focus();
      });
    } catch (err) {
      done = true;
      clearTimeout(timer);
      setAuthLoading(false);
      show((err && err.message) || 'Gagal memulai login');
    }
  });
})();
  </script>
  <script src="./modules/sdlg-hash-router.js?v=20261030-stable-v2"></script>
  <script src="./modules/sdlg-hash-tab-bridge.js?v=20261030-stable-v2"></script>
  <script src="./modules/sdlg-input-claim-lock.js?v=20261030-stable-v2"></script>
  <script src="./modules/sdlg-portal-finance-ux.js?v=20261030-stable-v2"></script>
</body>
</html>
