<!DOCTYPE html>
<html lang="id">
<head>
  <base href="./">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SDLG Warranty — Login</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { width: 100%; max-width: 400px; background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 28px; box-shadow: 0 20px 40px rgba(0,0,0,.35); }
    h1 { margin: 0 0 6px; font-size: 1.35rem; }
    p.sub { margin: 0 0 20px; color: #94a3b8; font-size: .9rem; }
    label { display: block; font-size: .8rem; color: #94a3b8; margin-bottom: 6px; }
    input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; margin-bottom: 14px; font-size: 1rem; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .err { color: #fca5a5; font-size: .85rem; min-height: 1.2em; margin: 0 0 10px; }
    .ok { color: #86efac; font-size: .85rem; }
  </style>
  <!-- SDLGHashRouter showBottomTaskbar sdlg-hash-router (runtime modules) -->
  <!-- routes: #/overview #/claims #/sdlg-input #/master-data -->
</head>
<body>
  <div class="card">
    <h1>SDLG Warranty</h1>
    <p class="sub">Masuk untuk melanjutkan</p>
    <div id="msg" class="err"></div>
    <form id="f">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button id="btn" type="submit">Masuk</button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
  <script src="./modules/supabase-client.js"></script>
  <script src="./modules/data-pipeline-guard.js"></script>
  <script src="./modules/claim-fields.js?v=20261026-login-freeze"></script>
  <script src="./modules/sdlg-repository.js"></script>
  <script src="./modules/paste-parse-ux.js"></script>
  <script src="./modules/wo-claim-policy.js"></script>
  <script src="./modules/wo-collision-modal.js"></script>
  <script>
(function () {
  var URL = 'https://frqvelcreczmnofldrga.supabase.co';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZycXZlbGNyZWN6bW5vZmxkcmdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMzQyMDksImV4cCI6MjEwMzkxMDIwOX0.EQoGxEu8cNDF84tObZH13rwHiYt9EGcqnJiT3yRMa-w';
  var msg = document.getElementById('msg');
  var btn = document.getElementById('btn');
  var client = null;

  function show(t, ok) {
    msg.textContent = t || '';
    msg.className = ok ? 'ok' : 'err';
  }

  function getClient() {
    if (client) return client;
    if (!window.supabase || !window.supabase.createClient) throw new Error('Supabase CDN gagal dimuat');
    client = window.supabase.createClient(URL, ANON, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false,
        storageKey: 'sb-frqvelcreczmnofldrga-auth-token'
      }
    });
    return client;
  }

  function goApp() {
    window.location.replace('./app.html?v=20261026-login-freeze');
  }

  // If already logged in, skip form
  setTimeout(function () {
    try {
      var c = getClient();
      var t = setTimeout(function () { /* ignore slow session */ }, 4000);
      c.auth.getSession().then(function (res) {
        clearTimeout(t);
        if (res && res.data && res.data.session) goApp();
      }).catch(function () {});
    } catch (e) {}
  }, 100);

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    show('');
    btn.disabled = true;
    btn.textContent = 'Memproses...';
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var done = false;
    var timer = setTimeout(function () {
      if (done) return;
      done = true;
      btn.disabled = false;
      btn.textContent = 'Masuk';
      show('Koneksi terlalu lama. Coba lagi.');
    }, 12000);
    try {
      var c = getClient();
      c.auth.signInWithPassword({ email: email, password: password }).then(function (res) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        if (res.error) {
btn.disabled = false;
btn.textContent = 'Masuk';
show(res.error.message || 'Login gagal');
return;
        }
        show('Berhasil. Membuka aplikasi...', true);
        setTimeout(goApp, 300);
      }).catch(function (err) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        btn.disabled = false;
        btn.textContent = 'Masuk';
        show((err && err.message) || 'Login gagal');
      });
    } catch (err) {
      done = true;
      clearTimeout(timer);
      btn.disabled = false;
      btn.textContent = 'Masuk';
      show((err && err.message) || 'Gagal memulai login');
    }
  });
})();
  </script>
  <script src="./modules/sdlg-hash-router.js"></script>
  <script src="./modules/sdlg-hash-tab-bridge.js"></script>
  <script src="./modules/sdlg-input-claim-lock.js"></script>
  <script src="./modules/sdlg-portal-finance-ux.js"></script>
</body>
</html>
