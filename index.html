<!DOCTYPE html>
<html lang="id">
<head>
  <base href="./">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SDLG Warranty — Login</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='white' font-size='14' font-family='system-ui' font-weight='700'%3ES%3C/text%3E%3C/svg%3E" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: "IBM Plex Sans", system-ui, -apple-system, Segoe UI, sans-serif;
      color: #0f172a;
      background:
        radial-gradient(900px 420px at 50% -80px, rgba(37, 99, 235, 0.10), transparent 60%),
        #eef2f6;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid #e6ebf2;
      border-radius: 18px;
      padding: 28px 28px 24px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.06);
    }
    .mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #1d4ed8;
      color: #fff;
      font-weight: 750;
      letter-spacing: -0.04em;
      margin-bottom: 16px;
    }
    .kicker {
      margin: 0 0 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #64748b;
    }
    h1 { margin: 0 0 6px; font-size: 1.45rem; letter-spacing: -0.03em; font-weight: 750; }
    p.sub { margin: 0 0 22px; color: #64748b; font-size: 0.92rem; line-height: 1.45; }
    label { display: block; font-size: 0.78rem; font-weight: 650; color: #475569; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #0f172a;
      margin-bottom: 14px;
      font-size: 1rem;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:focus {
      outline: none;
      border-color: #93c5fd;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }
    button {
      width: 100%;
      margin-top: 4px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #1d4ed8;
      color: #fff;
      font-weight: 680;
      font-size: 1rem;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: background-color .15s ease;
    }
    button:hover { background: #1e40af; }
    button:disabled { opacity: .65; cursor: wait; }
    .err { color: #b91c1c; font-size: .85rem; min-height: 1.2em; margin: 0 0 10px; }
    .ok { color: #047857; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">S</div>
    <p class="kicker">PT. Indo Traktor Utama</p>
    <h1>SDLG Warranty</h1>
    <p class="sub">Masuk untuk melanjutkan ke monitoring klaim.</p>
    <div id="msg" class="err"></div>
    <form id="f">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button id="btn" type="submit">Masuk</button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
  <script src="./modules/supabase-client.js?v=20261030-stable-v2"></script>
  <script src="./modules/data-pipeline-guard.js?v=20261030-stable-v2"></script>
  <script src="./modules/claim-fields.js?v=20261030-stable-v2"></script>
  <script src="./modules/sdlg-repository.js?v=20261030-stable-v2"></script>
  <script src="./modules/paste-parse-ux.js?v=20261030-stable-v2"></script>
  <script src="./modules/wo-claim-policy.js?v=20261030-stable-v2"></script>
  <script src="./modules/wo-collision-modal.js?v=20261030-stable-v2"></script>
  <script>
(function () {
  var URL = 'https://frqvelcreczmnofldrga.supabase.co';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZycXZlbGNyZWN6bW5vZmxkcmdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMzQyMDksImV4cCI6MjEwMzkxMDIwOX0.EQoGxEu8cNDF84tObZH13rwHiYt9EGcqnJiT3yRMa-w';
  var msg = document.getElementById('msg');
  var btn = document.getElementById('btn');
  var client = null;

  function show(t, ok) {
    msg.textContent = t || '';
    msg.className = ok ? 'ok' : 'err';
  }

  function getClient() {
    if (client) return client;
    if (!window.supabase || !window.supabase.createClient) throw new Error('Supabase CDN gagal dimuat');
    client = window.supabase.createClient(URL, ANON, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false,
        storageKey: 'sb-frqvelcreczmnofldrga-auth-token'
      }
    });
    return client;
  }

  function goApp() {
    window.location.replace('./app.html?v=20261105-overview-v1');
  }

  setTimeout(function () {
    try {
      var c = getClient();
      c.auth.getSession().then(function (res) {
        if (res && res.data && res.data.session) goApp();
      }).catch(function () {});
    } catch (e) {}
  }, 100);

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    show('');
    btn.disabled = true;
    btn.textContent = 'Memproses...';
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var done = false;
    var timer = setTimeout(function () {
      if (done) return;
      done = true;
      btn.disabled = false;
      btn.textContent = 'Masuk';
      show('Koneksi terlalu lama. Coba lagi.');
    }, 12000);
    try {
      var c = getClient();
      c.auth.signInWithPassword({ email: email, password: password }).then(function (res) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        if (res.error) {
          btn.disabled = false;
          btn.textContent = 'Masuk';
          show(res.error.message || 'Login gagal');
          return;
        }
        show('Berhasil. Membuka aplikasi...', true);
        setTimeout(goApp, 300);
      }).catch(function (err) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        btn.disabled = false;
        btn.textContent = 'Masuk';
        show((err && err.message) || 'Login gagal');
      });
    } catch (err) {
      done = true;
      clearTimeout(timer);
      btn.disabled = false;
      btn.textContent = 'Masuk';
      show((err && err.message) || 'Gagal memulai login');
    }
  });
})();
  </script>
  <script src="./modules/sdlg-hash-router.js?v=20261030-stable-v2"></script>
  <script src="./modules/sdlg-hash-tab-bridge.js?v=20261030-stable-v2"></script>
  <script src="./modules/sdlg-input-claim-lock.js?v=20261030-stable-v2"></script>
  <script src="./modules/sdlg-portal-finance-ux.js?v=20261030-stable-v2"></script>
</body>
</html>
